[project]
name = "demo-mcp"
version = "0.1.0"
description = "Tiny MCP server for MCP Gateway demos"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9.0,<2",
  "uvicorn>=0.34.0",
]

[project.scripts]
demo-mcp = "demo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_mcp"]
